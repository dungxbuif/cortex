syntax = "proto3";

package cortex;

option go_package = "cortex/internal/infrastructure/grpc/pb";

// Common Messages

message HealthCheckRequest {}
message HealthCheckResponse {
  string status = 1;
}

message SearchRequest {
  string query = 1;
  string owner_id = 2;
  int32 top_k = 3;
}

message DocumentMetadata {
  string id = 1;
  string owner_id = 2;
  string repo_url = 3;
  string branch = 4;
  string commit_sha = 5;
  string file_path = 6;
  string checksum = 7;
  string index_status = 8;
  string indexed_at = 9; // ISO8601 string
}

message ChunkMetadata {
  string id = 1;
  string document_id = 2;
  string owner_id = 3;
  string file_path = 4;
  int32 chunk_index = 5;
  string content = 6;
  repeated string heading_chain = 7;
  int32 token_count = 8;
}

message SearchResult {
  ChunkMetadata chunk = 1;
  DocumentMetadata document = 2;
  float score = 3;
}

message SearchResponse {
  repeated SearchResult results = 1;
}

message StringMapEntry {
  string key = 1;
  string value = 2;
}

// 1. Second Brain Service Definition

service SecondBrainService {
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc CreateCapture(CreateCaptureRequest) returns (CreateCaptureResponse);
  rpc ListCaptures(ListCapturesRequest) returns (ListCapturesResponse);
  rpc GetSyncStatus(GetSyncStatusRequest) returns (GetSyncStatusResponse);
  rpc SearchSecondBrain(SearchRequest) returns (SearchResponse);
  rpc SyncSecondBrainObject(SyncSecondBrainObjectRequest) returns (SyncSecondBrainObjectResponse);
}

message CreateCaptureRequest {
  string raw_text = 1;
  string source = 2;
  string owner_id = 3;
}

message CaptureRecord {
  string id = 1;
  string status = 2;
  string raw_text = 3;
  string normalized_markdown = 4;
  string vault_path = 5;
  string created_at = 6;
}

message CreateCaptureResponse {
  CaptureRecord capture = 1;
}

message ListCapturesRequest {
  string owner_id = 1;
}

message ListCapturesResponse {
  repeated CaptureRecord captures = 1;
}

message GetSyncStatusRequest {
  string owner_id = 1;
}

message GetSyncStatusResponse {
  int32 total_documents = 1;
  int32 indexed_documents = 2;
  int32 total_chunks = 3;
}

message SyncSecondBrainObjectRequest {
  string bucket = 1;
  string object_key = 2;
  string event_id = 3;
  string owner_id = 4;
}

message SyncSecondBrainObjectResponse {
  string status = 1;
  int32 processed_files = 2;
  int32 skipped_files = 3;
  int32 failed_files = 4;
  string object_key = 5;
  string message = 6;
}

// 2. Homelab Service Definition

service HomelabService {
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc SyncHomelab(SyncHomelabRequest) returns (SyncHomelabResponse);
  rpc SearchHomelab(SearchRequest) returns (SearchResponse);
  rpc ValidateLinks(ValidateLinksRequest) returns (ValidateLinksResponse);
}

message SyncHomelabRequest {
  string repo_path = 1;
  string repo_url = 2;
  string branch = 3;
  string commit_sha = 4;
  string owner_id = 5;
}

message SyncHomelabResponse {
  string status = 1;
  int32 processed_files = 2;
  int32 skipped_files = 3;
  int32 failed_files = 4;
}

message ValidateLinksRequest {
  string repo_path = 1;
}

message BrokenLink {
  string source_file = 1;
  int32 line_number = 2;
  string raw_link = 3;
  string reason = 4;
}

message ValidateLinksResponse {
  string status = 1;
  repeated BrokenLink broken_links = 2;
}

// 3. Orchestrator Service Definition

service OrchestratorService {
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc ChatCompletions(ChatCompletionsRequest) returns (ChatCompletionsResponse);
}

message ChatMessage {
  string role = 1;      // "system", "user", "assistant"
  string content = 2;
  string name = 3;
}

message ChatCompletionsRequest {
  repeated ChatMessage messages = 1;
  string owner_id = 2;
  string conversation_id = 3;
  string request_id = 4;
}

message ChatCompletionsResponse {
  string id = 1;
  string object = 2;
  int64 created = 3;
  string model = 4;
  message Choice {
    int32 index = 1;
    ChatMessage message = 2;
    string finish_reason = 3;
  }
  repeated Choice choices = 5;
}

// 4. System Policy And Audit Services

service PolicyService {
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc EvaluatePolicy(EvaluatePolicyRequest) returns (EvaluatePolicyResponse);
}

message EvaluatePolicyRequest {
  string module = 1;
  string capability = 2;
  string actor_type = 3;
  string actor_id = 4;
  string conversation_id = 5;
  string request_id = 6;
  string tool_name = 7;
  bool high_impact = 8;
  bool ambiguous = 9;
  bool low_confidence = 10;
  bool money_movement = 11;
  bool audit_read = 12;
  repeated StringMapEntry source_ref = 13;
  repeated StringMapEntry target_ref = 14;
  repeated StringMapEntry metadata = 15;
}

message EvaluatePolicyResponse {
  string decision = 1;
  string reason = 2;
  string audit_event_id = 3;
}

service AuditService {
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc AppendAuditEvent(AppendAuditEventRequest) returns (AppendAuditEventResponse);
}

message AppendAuditEventRequest {
  string event_type = 1;
  string module = 2;
  string actor_type = 3;
  string actor_id = 4;
  string conversation_id = 5;
  string request_id = 6;
  string tool_name = 7;
  string capability = 8;
  string status = 9;
  repeated StringMapEntry source_ref = 10;
  repeated StringMapEntry target_ref = 11;
  repeated StringMapEntry metadata = 12;
}

message AppendAuditEventResponse {
  string audit_event_id = 1;
}

// 5. Finance Service Definition

service FinanceService {
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc ListWallets(ListWalletsRequest) returns (ListWalletsResponse);
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
  rpc GetFinancialReport(GetFinancialReportRequest) returns (GetFinancialReportResponse);
  rpc GetNetWorth(GetNetWorthRequest) returns (GetNetWorthResponse);
}

message ListWalletsRequest {
  string owner_id = 1;
}

message WalletRecord {
  string id = 1;
  string owner_id = 2;
  string name = 3;
  string type = 4;
  string currency = 5;
  int64 initial_balance_minor = 6;
  int64 current_balance_minor = 7;
  bool include_in_total = 8;
  string status = 9;
  string created_at = 10; // ISO8601 string
  string updated_at = 11; // ISO8601 string
}

message ListWalletsResponse {
  repeated WalletRecord wallets = 1;
}

message ListCategoriesRequest {
  string owner_id = 1;
}

message CategoryRecord {
  string id = 1;
  string owner_id = 2;
  optional string parent_id = 3;
  string name = 4;
  string type = 5;
  string aliases = 6;
  string status = 7;
  string created_at = 8;  // ISO8601 string
  string updated_at = 9;  // ISO8601 string
}

message ListCategoriesResponse {
  repeated CategoryRecord categories = 1;
}

message GetFinancialReportRequest {
  string owner_id = 1;
  string period_start = 2; // ISO8601 string
  string period_end = 3;   // ISO8601 string
  optional string wallet_id = 4;
  optional string category_id = 5;
  bool include_investment = 6;
  string group_by = 7;
  bool use_created_at_audit_date = 8;
}

message GetFinancialReportResponse {
  string period_start = 1;
  string period_end = 2;
  string group_by = 3;
  int64 income_total_minor = 4;
  int64 expense_total_minor = 5;
  int64 net_cashflow_minor = 6;
  int64 transfer_in_total_minor = 7;
  int64 transfer_out_total_minor = 8;
  int64 excluded_total_minor = 9;
  int64 investment_cash_movement_total_minor = 10;
  map<string, int64> by_category = 11;
  map<string, int64> by_wallet = 12;
  map<string, int64> by_period = 13;
  repeated string warnings = 14;
}

message GetNetWorthRequest {
  string owner_id = 1;
  string as_of = 2; // ISO8601 string
}

message GetNetWorthResponse {
  string as_of = 1;
  int64 cash_total_minor = 2;
  int64 asset_value_minor = 3;
  int64 liability_minor = 4;
  int64 receivable_minor = 5;
  int64 net_worth_minor = 6;
  int64 realized_gain_minor = 7;
  int64 unrealized_gain_minor = 8;
  repeated string warnings = 9;
}

